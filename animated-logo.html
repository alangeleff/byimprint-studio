<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imprint — Animated Mark</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background:#1a1714;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:Georgia,serif;
  color:#f3f2e7;
}
.stage {
  display:flex; flex-direction:column;
  align-items:center; gap:22px;
  padding:50px 30px;
}
.mark-wrap {
  position:relative;
  width:220px; height:220px;
}
.mark-svg {
  width:220px; height:220px;
  display:block; overflow:visible;
}
.mark-svg #outer-ring { stroke:#f3f2e7; fill:none; }
.mark-svg #spiral-fill { fill:#f3f2e7; stroke:none; }
.mark-svg #spiral-stroke { stroke:#f3f2e7; fill:none; }
/* pen-tip glow overlay */
#pen-glow {
  position:absolute; top:0; left:0;
  width:220px; height:220px;
  pointer-events:none;
}

.wm-svg {
  width:190px; height:auto; display:block;
  opacity:0; transform:translateY(8px);
  will-change:opacity,transform;
}
.meta {
  display:flex; flex-direction:column;
  align-items:center; gap:4px;
}
.vname {
  font-size:11px; letter-spacing:0.18em;
  text-transform:uppercase;
  color:rgba(243,242,231,0.28);
  text-align:center; max-width:280px;
  line-height:1.5;
}
.replay-btn {
  background:none; border:none;
  color:rgba(243,242,231,0.35);
  font-size:11px; letter-spacing:0.1em;
  text-transform:uppercase; font-family:Georgia,serif;
  cursor:pointer; padding:6px 10px;
  transition:color 0.2s;
  -webkit-tap-highlight-color:transparent;
}
.replay-btn:hover { color:rgba(243,242,231,.75); }
.controls {
  display:flex; flex-wrap:wrap;
  gap:10px; justify-content:center;
}
.btn {
  background:transparent;
  border:1px solid rgba(243,242,231,0.22);
  color:rgba(243,242,231,0.7);
  padding:10px 20px; border-radius:100px;
  font-family:Georgia,serif; font-size:13px;
  cursor:pointer; letter-spacing:0.03em;
  transition:all 0.18s;
  -webkit-tap-highlight-color:transparent;
}
.btn.active { background:#f3f2e7; color:#1a1714; border-color:#f3f2e7; }
</style>
</head>

    </svg>

  <div class="meta">
    <div class="vname" id="vname">The Impression</div>
    <button class="replay-btn" id="replayBtn">&#8635; replay</button>
  </div>
  <div class="controls">
    <button class="btn active" data-v="impression">The Impression</button>
    <button class="btn" data-v="inkdraw">Ink Draw</button>
    <button class="btn" data-v="signal">Signal</button>
    <button class="btn" data-v="unfurl">Unfurl</button>
    <button class="btn" data-v="breathe">Breathe</button>
  </div>
</div>

<script>
(function() {
  var ring     = document.getElementById("outer-ring");
  var sfill    = document.getElementById("spiral-fill");
  var sstroke  = document.getElementById("spiral-stroke");
  var inkTip   = document.getElementById("ink-tip");
  var sigRings = document.querySelectorAll(".sig-ring");
  var wm       = document.querySelector(".wm-svg");
  var vname    = document.getElementById("vname");
  var group    = document.getElementById("mark-group");
  var canvas   = document.getElementById("pen-glow");
  var ctx      = canvas.getContext("2d");
  var raf      = null;
  var current  = "impression";

  // SVG viewBox to canvas coordinate scale
  var VB = 2048, CANVAS = 220;
  var scale = CANVAS / VB;

  var LABELS = {
    impression: "The Impression — ink tip races the spiral, ring seals it shut",
    inkdraw:    "Ink Draw — spiral & ring draw on together",
    signal:     "Signal — pulse rings broadcast outward, mark materializes",
    unfurl:     "Unfurl — springs from a point, elastic overshoot",
    breathe:    "Breathe — living loop"
  };

  var ringLen, spiralLen;
  function init() {
    ringLen    = ring.getTotalLength();
    spiralLen  = sstroke.getTotalLength();
    ring.style.strokeDasharray   = ringLen;
    ring.style.strokeDashoffset  = ringLen;
    sstroke.style.strokeDasharray  = spiralLen;
    sstroke.style.strokeDashoffset = spiralLen;
    setTimeout(function() { play("impression"); }, 500);
  }

  function ease(t)        { return t<.5?2*t*t:-1+(4-2*t)*t; }
  function easeOut3(t)    { return 1-Math.pow(1-t,3); }
  function easeOutQuart(t){ return 1-Math.pow(1-t,4); }
  function spring(t) {
    if (t>=1) return 1;
    return 1+Math.pow(2,-9*t)*Math.sin((t*9-.6)*(2*Math.PI/2.8));
  }

  function cancel() { if (raf) { cancelAnimationFrame(raf); raf=null; } }

  function resetAll() {
    cancel();
    ctx.clearRect(0,0,220,220);
    ring.style.strokeDashoffset  = ringLen;
    ring.style.opacity = "1";
    sfill.style.opacity = "0";
    sfill.style.transform = "";
    sstroke.style.strokeDashoffset = spiralLen;
    sstroke.style.opacity = "1";
    inkTip.setAttribute("opacity","0");
    sigRings.forEach(function(r){ r.setAttribute("opacity","0"); r.setAttribute("r","388"); });
    group.style.transform = "";
    group.style.opacity = "1";
    wm.style.opacity = "0";
    wm.style.transform = "translateY(8px)";
    wm.style.transition = "none";
  }

  function showWM(delay) {
    setTimeout(function() {
      wm.style.transition="opacity .6s ease,transform .6s ease";
      wm.style.opacity="1";
      wm.style.transform="translateY(0)";
    }, delay||0);
  }

  // ── THE IMPRESSION ────────────────────────────────────────────────────────
  // A glowing ink tip races along the spiral path leaving a hot trail,
  // then flies off and the ring seals shut clockwise.
  function playImpression() {
    resetAll();
    sfill.style.opacity = "0.08"; // ghost of the mark underneath

    var SPIRAL_DUR = 2000;
    var RING_DUR   = 700;
    var spiralStart = null, ringStart = null, ringStarted = false;

    // Glow trail on canvas
    function drawTrail(progress) {
      ctx.clearRect(0,0,220,220);
      if (progress <= 0) return;
      // Draw the trail as a series of diminishing circles
      var steps = Math.floor(progress * spiralLen);
      var TRAIL = 180; // trail length in SVG units
      var startDist = Math.max(0, steps - TRAIL);
      for (var d = startDist; d <= steps; d += 6) {
        var pt = sstroke.getPointAtLength(d);
        var x = pt.x * scale, y = pt.y * scale;
        var trailT = (d - startDist) / TRAIL;
        var alpha = trailT * 0.35;
        var r = 3 + trailT * 5;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI*2);
        ctx.fillStyle = "rgba(255,255,245,"+alpha+")";
        ctx.fill();
      }
      // Bright tip
      if (steps < spiralLen) {
        var tipPt = sstroke.getPointAtLength(steps);
        var tx = tipPt.x * scale, ty = tipPt.y * scale;
        var grd = ctx.createRadialGradient(tx,ty,0,tx,ty,20);
        grd.addColorStop(0,"rgba(255,255,252,0.95)");
        grd.addColorStop(0.3,"rgba(243,242,231,0.5)");
        grd.addColorStop(1,"rgba(243,242,231,0)");
        ctx.beginPath();
        ctx.arc(tx,ty,20,0,Math.PI*2);
        ctx.fillStyle=grd;
        ctx.fill();
        // Tight hot dot
        ctx.beginPath();
        ctx.arc(tx,ty,5,0,Math.PI*2);
        ctx.fillStyle="rgba(255,255,252,1)";
        ctx.fill();
      }
    }

    function frame(ts) {
      // Spiral phase
      if (!spiralStart) spiralStart = ts;
      var sRaw = Math.min((ts-spiralStart)/SPIRAL_DUR, 1);
      var sT   = ease(sRaw);
      var dist = sT * spiralLen;
      sstroke.style.strokeDashoffset = spiralLen - dist;
      drawTrail(sT);
      // Also fade in the fill as spiral traces
      sfill.style.opacity = Math.max(0.08, sT * 0.7);

      // Ring seals when spiral is 60% done
      if (sRaw >= 0.6 && !ringStarted) {
        ringStarted = true;
        ringStart = ts;
      }
      if (ringStarted) {
        var rRaw = Math.min((ts-ringStart)/RING_DUR, 1);
        var rT   = easeOutQuart(rRaw);
        ring.style.strokeDashoffset = ringLen * (1-rT);
      }

      if (sRaw < 1 || (ringStarted && (ts-ringStart)/RING_DUR < 1)) {
        raf = requestAnimationFrame(frame);
      } else {
        // Finalize
        ctx.clearRect(0,0,220,220);
        sstroke.style.strokeDashoffset = "0";
        ring.style.strokeDashoffset = "0";
        sfill.style.opacity = "1";
        // Brief stamp/settle
        var sttStart = null;
        function settle(ts2) {
          if (!sttStart) sttStart = ts2;
          var st = Math.min((ts2-sttStart)/400, 1);
          var s = 1 + spring(st)*0.035 - 0.035;
          group.style.transformOrigin="1024px 1025px";
          group.style.transform="scale("+s+")";
          if (st<1) raf=requestAnimationFrame(settle);
          else { group.style.transform=""; showWM(100); }
        }
        raf=requestAnimationFrame(settle);
      }
    }
    raf = requestAnimationFrame(frame);
  }

  // ── INK DRAW ─────────────────────────────────────────────────────────────
  function playInkDraw() {
    resetAll();
    var DUR = 2000, start = null;
    function frame(ts) {
      if (!start) start = ts;
      var raw = Math.min((ts-start)/DUR, 1);
      var t = ease(raw);
      sstroke.style.strokeDashoffset = spiralLen*(1-t);
      var ringT = Math.max(0,(t-.1)/.9);
      ring.style.strokeDashoffset = ringLen*(1-ease(ringT));
      sfill.style.opacity = Math.max(0,(t-.4)/.6);
      if (raw<1) {
        raf=requestAnimationFrame(frame);
      } else {
        sstroke.style.strokeDashoffset="0";
        ring.style.strokeDashoffset="0";
        sfill.style.opacity="1";
        showWM(100);
      }
    }
    raf=requestAnimationFrame(frame);
  }

  // ── SIGNAL ───────────────────────────────────────────────────────────────
  // Concentric rings pulse outward like a broadcast, then the mark materializes
  function playSignal() {
    resetAll();
    sfill.style.opacity="0";
    var delays = [0, 280, 560];
    var ringAnimStates = [{t:0,active:false},{t:0,active:false},{t:0,active:false}];
    var pulseStart = null;
    var PULSE_DUR = 900;
    var materialStart = null, materialStarted = false;

    // Start each ring at staggered times
    var ringTimers = delays.map(function(d, i) {
      return setTimeout(function() {
        ringAnimStates[i].active = true;
        ringAnimStates[i].start = null;
      }, d);
    });

    var allPulsed = false;
    var materialTimer = setTimeout(function() {
      materialStarted = true;
      materialStart = null;
    }, 900);

    function frame(ts) {
      var stillGoing = false;

      // Animate pulse rings
      sigRings.forEach(function(sr, i) {
        var s = ringAnimStates[i];
        if (!s.active) return;
        if (!s.start) s.start = ts;
        var raw = Math.min((ts-s.start)/PULSE_DUR, 1);
        var t = easeOut3(raw);
        // scale radius outward, fade out
        var r = 388 + t * 320;
        var op = (1-t) * 0.55;
        sr.setAttribute("r", r);
        sr.setAttribute("opacity", op);
        if (raw < 1) stillGoing = true;
      });

      // After pulses, materialize the mark
      if (materialStarted) {
        if (!materialStart) materialStart = ts;
        var MAT_DUR = 1500;
        var mRaw = Math.min((ts-materialStart)/MAT_DUR, 1);
        var mT = ease(mRaw);
        // Ring closes
        ring.style.strokeDashoffset = ringLen*(1-easeOut3(mRaw));
        // Spiral draws
        sstroke.style.strokeDashoffset = spiralLen*(1-mT);
        sfill.style.opacity = Math.max(0,(mT-.3)/.7);
        if (mRaw < 1) stillGoing = true;
        else {
          ring.style.strokeDashoffset="0";
          sstroke.style.strokeDashoffset="0";
          sfill.style.opacity="1";
          showWM(100);
        }
      } else { stillGoing = true; }

      if (stillGoing) raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
  }

  // ── UNFURL ───────────────────────────────────────────────────────────────
  function playUnfurl() {
    resetAll();
    sfill.style.opacity="1";
    ring.style.strokeDashoffset="0";
    sstroke.style.strokeDashoffset="0";
    group.style.opacity="0";
    group.style.transform="scale(0.04)";
    var DUR=1100, start=null;
    function frame(ts) {
      if (!start) start=ts;
      var t=Math.min((ts-start)/DUR,1);
      var s=0.04+spring(t)*0.96;
      group.style.transformOrigin="1024px 1025px";
      group.style.transform="scale("+s+")";
      group.style.opacity=Math.min(t*6,1).toString();
      if (t<1) raf=requestAnimationFrame(frame);
      else { group.style.transform=""; group.style.opacity="1"; showWM(100); }
    }
    raf=requestAnimationFrame(frame);
  }

  // ── BREATHE ──────────────────────────────────────────────────────────────
  function playBreathe() {
    resetAll();
    sfill.style.opacity="1";
    ring.style.strokeDashoffset="0";
    sstroke.style.strokeDashoffset="0";
    wm.style.transition="opacity .6s ease,transform .6s ease";
    wm.style.opacity="1";
    wm.style.transform="translateY(0)";
    var PERIOD=3400,start=null;
    function frame(ts) {
      if (!start) start=ts;
      var t=((ts-start)%PERIOD)/PERIOD;
      var sine=Math.sin(t*Math.PI*2);
      group.style.transformOrigin="1024px 1025px";
      group.style.transform="scale("+(1+sine*.022)+")";
      group.style.opacity=(0.9+sine*.1).toString();
      raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
  }

  var variants={impression:playImpression,inkdraw:playInkDraw,signal:playSignal,unfurl:playUnfurl,breathe:playBreathe};

  function play(v) {
    current=v;
    vname.textContent=LABELS[v];
    document.querySelectorAll(".btn").forEach(function(b){b.classList.toggle("active",b.dataset.v===v);});
    variants[v]();
  }

  document.querySelectorAll(".btn").forEach(function(b){b.addEventListener("click",function(){play(b.dataset.v);});});
  document.getElementById("replayBtn").addEventListener("click",function(){play(current);});

  if (document.readyState==="complete") init();
  else window.addEventListener("load",init);
})();
</script>
</body>
